name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --locked -p embersong-core -p embersong-synth -p embersong-wasm
      - run: cargo clippy --locked -p embersong-core -p embersong-synth -p embersong-wasm -- -D warnings
      - run: cargo fmt --check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - run: cargo build --locked -p embersong-wasm --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: target/wasm32-unknown-unknown/release/embersong_wasm.wasm
